<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Material List</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container wide">
    <header class="header"><h1>My Material List</h1>
        <div class="actions"><a class="button primary" href="/material-create.html">Add New Material</a><a
                class="button secondary" href="/tags.html">Manage Tags</a>
            <form action="/logout" method="post">
                <button class="button danger" type="submit">Logout</button>
            </form>
        </div>
    </header>
    <nav class="page-tabs" aria-label="Content type">
        <a class="page-tab active" href="/materials.html">Materials</a>
        <a class="page-tab" href="/mindmaps.html">Mindmaps</a>
    </nav>
    <section class="panel">
        <form id="searchForm" class="header search-row-with-reset">
            <div class="actions">
                <fieldset class="search-options">
                    <legend>Search by</legend>
                    <label class="search-option" for="searchTitle">
                        <input type="radio" id="searchTitle" name="searchType" value="title" checked>
                        <span>Title</span>
                    </label>
                    <label class="search-option" for="searchTag">
                        <input type="radio" id="searchTag" name="searchType" value="tag">
                        <span>Tag</span>
                    </label>
                </fieldset>
                  <div class="search-input-wrap">
                      <div id="selectedTagsContainer" class="selected-tags" aria-live="polite"></div>
                      <input id="searchKeyword" name="keyword" type="search"
                          placeholder="Search material title or tag (comma-separated)" autocomplete="off">
                      <div id="tagSuggestions" class="tag-suggestions" role="listbox" hidden></div>
                  </div>
                <button class="button secondary" type="submit">Search</button>
                <a class="button secondary small reset-button" href="/materials.html">Show All</a>
            </div>
        </form>
        <div id="materialList" class="list" th:hidden="${#lists.isEmpty(materials)}">
            <article class="material" th:each="item : ${materials}" th:attr="data-id=${item.id}" tabindex="0"><h2><span
                    class="material-title" th:text="${item.title}">Title</span></h2>
                <p><strong>Created:</strong> <span th:text="${item.createdAt}">Date</span></p>
                <p th:text="${item.memo ?: 'No memo available.'}">Memo</p>
                <p th:if="${item.url}"><strong>Link:</strong> <a class="url" th:href="${item.url}" th:text="${item.url}"
                                                                 target="_blank" rel="noopener noreferrer">URL</a></p>
                <div class="tags"><a class="tag" th:each="tag : ${item.tags}"
                                     th:href="@{/materials.html(tags=${tag.name})}" th:text="${tag.name}">Tag</a></div>
            </article>
        </div>
        <template id="materialTemplate">
            <article class="material">
                <h2><a class="material-title"></a></h2>
                <p><strong>Created:</strong> <span class="material-created"></span></p>
                <p class="material-memo"></p>
                <p class="material-url-row"><strong>Link:</strong> <a class="url material-url" target="_blank" rel="noopener noreferrer"></a></p>
                <div class="tags material-tags"></div>
            </article>
        </template>
        <template id="tagSuggestionTemplate">
            <button class="tag-suggestion" type="button" role="option"></button>
        </template>
        <div id="emptyMessage" class="empty" th:hidden="${!#lists.isEmpty(materials)}">No materials registered.</div>
    </section>
</main>
    <script th:src="@{/js/materials.js}"></script>
</body>
</html>
