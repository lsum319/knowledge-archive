<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${material != null ? material.title + ' - Detail' : 'Material Detail'}">Material Detail</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container">
    <header class="header"><h1>Material Detail</h1>
        <div class="actions"><a class="button secondary" href="/materials.html">Back to List</a><a
                class="button primary" th:if="${material != null}" th:href="@{/material-edit.html(id=${material.id})}">Edit</a>
            <button class="button danger" type="button" id="deleteButton" th:if="${material != null}"
                    th:attr="data-id=${material.id}">Delete
            </button>
        </div>
    </header>
    <section class="panel" th:if="${material != null}">
        <div class="meta">
            <div class="meta-item"><strong>Title</strong><span th:text="${material.title}">Title</span></div>
            <div class="meta-item"><strong>Created</strong><span th:text="${material.createdAt}">Date</span></div>
            <div class="meta-item"><strong>Updated</strong><span th:text="${material.updatedAt}">Date</span></div>
        </div>
        <div class="content-block"><h3>Memo</h3>
            <div class="content" th:text="${material.memo ?: 'No memo available.'}">Memo</div>
        </div>
        <div class="content-block"><h3>URL</h3>
            <div class="content"><a th:if="${material.url}" th:href="${material.url}" th:text="${material.url}"
                                    target="_blank" rel="noopener noreferrer">URL</a><span th:unless="${material.url}">No URL provided.</span>
            </div>
        </div>
        <div class="content-block"><h3>Tags</h3>
                <div class="tags"><a class="tag" th:each="tag : ${material.tags}"
                          th:href="@{/materials.html(tag=${tag.name})}" th:text="${tag.name}">Tag</a><span
                    th:if="${#lists.isEmpty(material.tags)}">No tags</span></div>
        </div>
    </section>
    <section class="panel" th:unless="${material != null}"><p>Material not found.</p></section>
</main>
<script th:src="@{/js/material-detail.js}"></script>
</body>
</html>
