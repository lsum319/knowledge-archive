<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My Mindmap List</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container wide">
	<header class="header">
		<h1>My Mindmap List</h1>
		<div class="actions">
			<a class="button secondary" href="/materials.html">Materials</a>
			<form action="/logout" method="post">
				<button class="button danger" type="submit">Logout</button>
			</form>
		</div>
	</header>
	<nav class="page-tabs" aria-label="Content type">
		<a class="page-tab" href="/materials.html">Materials</a>
		<a class="page-tab active" href="/mindmaps.html">Mindmaps</a>
	</nav>
	<section class="panel">
		<form id="mindmapForm" class="create-form">
			<label class="sr-only" for="mindmapName">Mindmap name</label>
			<input id="mindmapName" name="name" required maxlength="100" placeholder="Name your new mindmap">
			<button class="button primary" type="submit">Create Mindmap</button>
		</form>
		<div id="message" class="message" role="status" aria-live="polite"></div>
		<div id="mindmapList" class="list" th:hidden="${#lists.isEmpty(mindmaps)}">
			<article class="mindmap" th:each="item : ${mindmaps}" th:attr="data-id=${item.id}">
				<div>
					<h2 th:text="${item.name}">Mindmap name</h2>
					<p><strong>Created:</strong> <span th:text="${item.createdAt}">Date</span></p>
				</div>
				<button class="button danger delete-mindmap" type="button">Delete</button>
			</article>
		</div>
		<template id="mindmapTemplate">
			<article class="mindmap">
				<div><h2 class="mindmap-name"></h2><p><strong>Created:</strong> <span class="mindmap-created"></span></p></div>
				<button class="button danger delete-mindmap" type="button">Delete</button>
			</article>
		</template>
		<div id="emptyMessage" class="empty" th:hidden="${!#lists.isEmpty(mindmaps)}">No mindmaps registered.</div>
	</section>
</main>
<script th:src="@{/js/mindmaps.js}"></script>
</body>
</html>
