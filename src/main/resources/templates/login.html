<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Archive - Login</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="card login-card"><h1>Knowledge Archive</h1>
    <p>Record and manage your knowledge.</p>
    <form id="loginForm" class="form">
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password"
                                                                        required></div>
        <div id="message" class="message"></div>
        <button class="button primary" type="submit">Login</button>
        <button class="button secondary" type="button" onclick="location.href='/signup'">Sign Up</button>
    </form>
</main>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
