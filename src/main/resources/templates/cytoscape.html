<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindmap Graph</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container wide">
    <header class="header">
        <div>
            <p class="eyebrow">Mindmap visualization</p>
            <h1>Knowledge Graph</h1>
        </div>
        <div class="actions">
            <a class="button secondary" href="/mindmaps.html">All Mindmaps</a>
            <form action="/logout" method="post">
                <button class="button danger" type="submit">Logout</button>
            </form>
        </div>
    </header>
    <section class="panel graph-panel">
        <div class="graph-toolbar">
            <p id="cytoscapeMessage" class="message" role="status" aria-live="polite">Loading graph...</p>
            <div class="graph-toolbar-actions">
                <button id="fitGraph" class="button secondary" type="button">Fit graph</button>
                <button id="createNodeButton" class="button primary" type="button">New node</button>
                <button id="toggleNodeSidebar" class="button secondary" type="button" aria-expanded="true" aria-controls="nodeSidebar">Hide details</button>
            </div>
        </div>
        <div id="graphWorkspace" class="graph-workspace">
            <div id="cy" class="cytoscape-graph" aria-label="Mindmap graph"></div>
            <aside id="nodeSidebar" class="node-sidebar" aria-labelledby="nodeSidebarTitle">
                <div class="node-sidebar-header">
                    <div>
                        <p class="eyebrow">Selected node</p>
                        <h2 id="nodeSidebarTitle">Node details</h2>
                    </div>
                    <button id="closeNodeSidebar" class="icon-button" type="button" aria-label="Close node details">×</button>
                </div>
                <p id="nodeSidebarEmpty" class="sidebar-empty">Select a node to view and edit its details.</p>
                <form id="nodeDetailsForm" class="node-details-form" hidden>
                    <div class="field">
                        <label for="nodeTitle">Title</label>
                        <input id="nodeTitle" required>
                    </div>
                    <div class="field">
                        <label for="nodeUrl">Reference URL</label>
                        <input id="nodeUrl" type="url">
                    </div>
                    <div class="field">
                        <label for="nodeMemo">Memo</label>
                        <textarea id="nodeMemo"></textarea>
                    </div>
                    <div class="field">
                        <label>Tags</label>
                        <div id="nodeTags" class="tag-list"></div>
                    </div>
                    <p id="nodeDetailsMessage" class="message" role="status" aria-live="polite"></p>
                    <div class="form-actions">
                        <button class="button primary" type="submit">Save changes</button>
                    </div>
                </form>
            </aside>
        </div>
    </section>
    <dialog id="createNodeDialog" class="edge-dialog" aria-labelledby="createNodeDialogTitle">
        <h2 id="createNodeDialogTitle">Create node</h2>
        <form id="createNodeForm">
            <div id="newMaterialFields">
                <div class="field">
                    <label for="newNodeTitle">Title</label>
                    <input id="newNodeTitle" required>
                    <div id="existingMaterialResults" class="material-search-results" role="listbox" aria-label="Matching existing materials" hidden></div>
                </div>
                <div class="field">
                    <label for="newNodeUrl">Reference URL</label>
                    <input id="newNodeUrl" type="url">
                </div>
                <div class="field">
                    <label for="newNodeMemo">Memo</label>
                    <textarea id="newNodeMemo"></textarea>
                </div>
            </div>
            <p id="createNodeMessage" class="message" role="status" aria-live="polite"></p>
            <div class="form-actions">
                <button id="cancelCreateNode" class="button secondary" type="button">Cancel</button>
                <button id="submitCreateNode" class="button primary" type="submit">Create node</button>
            </div>
        </form>
    </dialog>
</body>
<script th:inline="javascript">
    window.mindmapId = /*[[${mindmapId}]]*/ 0;
    window.mindmapTitle = /*[[${mindmapTitle}]]*/ "";
</script>
<script src="https://unpkg.com/cytoscape@3.31.2/dist/cytoscape.min.js"></script>
<script th:src="@{/js/cytoscape.js}"></script>
</html>
