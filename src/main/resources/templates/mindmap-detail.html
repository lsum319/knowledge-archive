<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindmap Materials</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container wide">
    <header class="header">
        <h1>Mindmap Materials</h1>
        <div class="actions">
            <a class="button primary" th:href="@{/cytoscape.html(id=${param.id[0]})}">View Graph</a>
            <a class="button secondary" href="/mindmaps.html">Back to Mindmaps</a>
            <a class="button secondary" href="/materials.html">Materials</a>
            <form action="/logout" method="post">
                <button class="button danger" type="submit">Logout</button>
            </form>
        </div>
    </header>
    <nav class="page-tabs" aria-label="Content type">
        <a class="page-tab" href="/materials.html">Materials</a>
        <a class="page-tab active" href="/mindmaps.html">Mindmaps</a>
    </nav>
    <section class="panel">
        <form id="materialSearchForm" class="header search-row-with-reset">
            <div class="actions">
                <div class="search-input-wrap">
                    <label class="sr-only" for="materialSearchKeyword">Search materials</label>
                    <input id="materialSearchKeyword" type="search" placeholder="Search material title" autocomplete="off">
                    <div id="materialSuggestions" class="tag-suggestions" role="listbox" hidden></div>
                </div>
                <button class="button secondary" type="submit">Search</button>
            </div>
        </form>
        <div id="mindmapMessage" class="message" role="status" aria-live="polite"></div>
        <div id="materialList" class="list" th:hidden="${#lists.isEmpty(materials)}">
            <article class="material" th:each="item : ${materials}" th:attr="data-id=${item.materialId}" tabindex="0">
                <h2><a th:href="@{/material-detail.html(id=${item.materialId})}" th:text="${item.title}">Material title</a></h2>
                <p>Open material details</p>
                <button class="button danger material-remove" type="button" th:attr="data-id=${item.materialId}">Remove</button>
            </article>
        </div>
        <div class="empty" th:hidden="${!#lists.isEmpty(materials)}">No materials in this mindmap.</div>
    </section>
</main>
<script th:inline="javascript">
    window.mindmapId = /*[[${param.id[0]}]]*/ 0;
</script>
<script th:src="@{/js/mindmap-detail.js}"></script>
</body>
</html>
